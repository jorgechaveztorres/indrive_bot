name: Compilar APK Release Trujillo
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with: { java-version: '17', distribution: 'temurin' }
    - name: Setup Gradle 8.4 PINNEADO
      uses: gradle/actions/setup-gradle@v4
      with: { gradle-version: 8.4 }
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Crear keystore debug para release
      run: |
        cd android_app/app
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Shocos, OU=Shop, O=Shop, L=Trujillo, S=La Libertad, C=PE" || echo "keystore ya existe"
    - name: Compilar APK RELEASE
      run: |
        cd android_app
        gradle assembleRelease --stacktrace
        ls -lh app/build/outputs/apk/release/
        ls -lh app/build/outputs/apk/debug/ || true
    - name: Guardar APK Release
      uses: actions/upload-artifact@v4
      with:
        name: asistente-trujillo-overlay-verde-RELEASE
        path: |
          android_app/app/build/outputs/apk/release/*.apk
          android_app/app/build/outputs/apk/debug/*.apk
