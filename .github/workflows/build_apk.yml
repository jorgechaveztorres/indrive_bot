name: Compilar APK Asistente Trujillo - Overlay Verde
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with: { java-version: '17', distribution: 'temurin' }
    - name: Setup Gradle 8.4 PINNEADO
      uses: gradle/actions/setup-gradle@v4
      with: { gradle-version: 8.4 }
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Compilar APK REAL
      run: |
        cd android_app
        gradle assembleDebug --stacktrace
        ls -lh app/build/outputs/apk/debug/
    - name: Guardar APK
      uses: actions/upload-artifact@v4
      with: { name: asistente-trujillo-overlay-verde, path: android_app/app/build/outputs/apk/debug/*.apk }
