name: Compilar APK InDrive Bot

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema y Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev
        pip install --upgrade pip
        pip install --upgrade cython buildozer

    - name: Compilar APK con Buildozer
      run: |
        buildozer -v android debug

    - name: Guardar APK como Artifact
      uses: actions/upload-artifact@v4
      with:
        name: indrive-bot-apk
        path: bin/*.apk
