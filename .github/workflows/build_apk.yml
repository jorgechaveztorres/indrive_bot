name: Compilar APK InDrive Bot

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema y Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev
        pip install --upgrade pip
        pip install --upgrade cython buildozer

    - name: Pre-aceptar licencias de Android SDK oficialmente
      run: |
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n8d3184d2a6327b403e913ec10c3cb941e7a5c5f" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n24333f8a43b682421c570f5e1f0e8f3ef2b77a0a" >> /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\nd56f5187479451eabf01fb78af6dfcb131a648ab" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

    - name: Compilar APK con Buildozer
      run: |
        buildozer -v android debug

    - name: Guardar APK como Artifact
      uses: actions/upload-artifact@v4
      with:
        name: indrive-bot-apk
        path: bin/*.apk
