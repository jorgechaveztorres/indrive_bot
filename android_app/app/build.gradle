plugins { id 'com.android.application' }
android {
    namespace 'com.shocos.asistente'
    compileSdk 34
    defaultConfig {
        applicationId "com.shocos.asistente"
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName "14-overlay-verde-real"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
